[project]
name = "pointcloud-playground"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.6.0",
    "transformers==4.51.3",
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "python-multipart==0.0.20",
    "numpy==2.2.5",
    "pillow==11.2.1",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
