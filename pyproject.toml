[project]
name = "blockshot"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.51.3",
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "python-multipart==0.0.20",
    "numpy==2.2.5",
    "pillow==11.2.1",
    "moge",
    "vggt",
    "diffusers==0.35.2",
    "accelerate==1.15.0",
    "scipy==1.17.1",
    "opencv-python-headless==5.0.0.93",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.uv]
package = false
# vggt 0.0.1 pins numpy<2 but moge 3 needs numpy>=2; vggt runs fine on numpy 2 (covered by tests/).
override-dependencies = ["numpy==2.2.5"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "74fbce054ebed49800de42d0ad0e83495065719a" }
vggt = { git = "https://github.com/facebookresearch/vggt.git", rev = "a288dd0f14786c93483e45524328726ab7b1b4ce" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
